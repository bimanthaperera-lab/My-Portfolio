<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="Bimantha Perera — full-stack and Android developer based in Colombo, Sri Lanka."
    />
    <title>Bimantha Perera — Software Engineer</title>

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (LinkedIn, WhatsApp, Slack, X…).
         Crawlers need a full URL for the image: set VITE_SITE_URL in .env
         to the deployed address, e.g. https://bimantha.dev -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bimantha Perera" />
    <meta property="og:title" content="Bimantha Perera — Full-stack & Android Developer" />
    <meta
      property="og:description"
      content="Full-stack and Android developer in Colombo. Built and deployed NexCV, an AI-powered CV builder; now building PickSmart for Android."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bimantha Perera — Full-stack & Android developer" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Apply the saved (or system) theme before first paint, so there's no flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var light = saved
            ? saved === "light"
            : window.matchMedia("(prefers-color-scheme: light)").matches;
          if (light) {
            document.documentElement.classList.add("light");
            document.querySelector('meta[name="theme-color"]').content = "#f7f5f0";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
